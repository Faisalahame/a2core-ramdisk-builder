name: Build AOSP Android 10 Generic Ramdisk

on:
  workflow_dispatch: {}

jobs:
  build-ramdisk:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h

      - name: Install AOSP host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            openjdk-8-jdk bc rsync

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git identity (repo tool requires this)
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global color.ui false

      - name: repo init (AOSP GSI manifest, Android 10)
        run: |
          mkdir -p "$HOME/aosp" && cd "$HOME/aosp"
          repo init -u https://android.googlesource.com/platform/manifest \
            -b android10-gsi --depth=1 \
            -g pdk,-notdefault

      - name: Trim projects Soong can't resolve
        run: |
          mkdir -p "$HOME/aosp/.repo/local_manifests"
          cat > "$HOME/aosp/.repo/local_manifests/trim.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Drop atest (needs tradefed, not in pdk) -->
            <remove-project name="platform/tools/asuite" />
            
            <!-- Drop projects that depend on full framework modules (framework-res, 
                 android_stubs_current, ext, etc.) which are excluded from the pdk group.
                 None of these are needed to build the generic ramdisk (init + init.rc). -->
            <remove-project name="platform/external/apache-http" />
            <remove-project name="platform/packages/apps/TimeZoneUpdater" />
            <remove-project name="platform/system/timezone/distro/installer" />
            <remove-project name="platform/external/dexmaker" />
            <remove-project name="platform/frameworks/opt/telephony" />
            <remove-project name="platform/system/apex" />
            <remove-project name="platform/prebuilts/sdk" />
          </manifest>
          EOF

      - name: repo sync
        run: |
          cd "$HOME/aosp"
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync
          df -h

      - name: Build ramdisk
        run: |
          cd "$HOME/aosp"
          source build/envsetup.sh
          lunch aosp_arm_ab-userdebug
          make ramdisk -j"$(nproc)"

      - name: Locate output
        run: |
          cd "$HOME/aosp"
          find out/target/product -maxdepth 2 -iname "ramdisk*.img" -exec ls -la {} \;
          mkdir -p /tmp/artifact
          find out/target/product -maxdepth 2 -iname "ramdisk*.img" -exec cp {} /tmp/artifact/ \;

      - name: Upload ramdisk.img
        uses: actions/upload-artifact@v4
        with:
          name: aosp10-generic-ramdisk
          path: /tmp/artifact/*
          retention-days: 14
          if-no-files-found: error
